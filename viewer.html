<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video İzleme</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .error-container {
            text-align: center;
            padding: 60px 20px;
        }

        .error-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .error-message {
            color: #dc3545;
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .error-description {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        .back-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .video-container {
            margin-top: 30px;
        }

        .video-info {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #2196f3;
        }

        .video-info h3 {
            color: #1976d2;
            margin-bottom: 10px;
        }

        .video-info p {
            color: #555;
            margin-bottom: 5px;
        }

        .video-wrapper {
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        video {
            width: 100%;
            display: block;
        }

        .view-counter {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }

        .view-counter strong {
            color: #667eea;
            font-size: 1.3em;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .notification.error {
            background: #dc3545;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Yükleniyor...</p>
        </div>

        <div id="error" class="error-container" style="display: none;">
            <div class="error-icon">❌</div>
            <h1 class="error-message">Geçersiz Link</h1>
            <p class="error-description">Bu link geçersiz veya süresi dolmuş olabilir.</p>
            <a href="admin.html" class="back-btn">Admin Paneline Dön</a>
        </div>

        <div id="videoSection" style="display: none;">
            <h1>🎬 Video İzleme</h1>
            <p class="subtitle">Proje_Taslak_v7.mp4</p>

            <div class="video-info">
                <h3>📋 Video Bilgileri</h3>
                <p><strong>Link Kodu:</strong> <span id="linkCode"></span></p>
                <p><strong>Kalan İzleme Hakkı:</strong> <span id="remainingViews"></span></p>
            </div>

            <div class="video-wrapper">
                <video id="videoPlayer" controls>
                    <source src="Proje_Taslak_v7.mp4" type="video/mp4">
                    Tarayıcınız video öğesini desteklemiyor.
                </video>
            </div>

            <div class="view-counter">
                <p>Bu link ile <strong id="viewCountDisplay"></strong> kez daha izleyebilirsiniz.</p>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script src="viewer.js"></script>
</body>
</html>
